<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1306203 Signals &amp; Systems | Unit Circle vs Sinusoid Signals</title>
<style>
:root{--bg:#ffffff;--fg:#1f2a44;--line:#d3dcf0;--accent:#e5484d;}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b0f17;--fg:#e6edf7;--line:#2f3b57;--accent:#ff6b6b;}
}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;}
.tabs{display:flex;flex-wrap:wrap;gap:4px;max-width:1500px;margin:0 auto;padding:12px 16px 0;
      border-bottom:1px solid var(--line);}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:inherit;
      font:inherit;font-size:15px;padding:10px 14px;cursor:pointer;opacity:.8;}
.tabs button:hover{opacity:1;}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);opacity:1;font-weight:bold;}
.view{max-width:1500px;margin:0 auto;padding:8px 8px 24px;}
iframe{display:none;width:100%;border:0;min-height:600px;}
iframe.active{display:block;}
</style>
</head>
<body>

<div class="tabs" role="tablist">
    <button role="tab" data-app="unit-circle">Unit Circle &amp; Sinusoids</button>
</div>

<div class="view" id="view"></div>

<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll(".tabs button"));
  var view=document.getElementById("view");
  var frames={};

  function show(app){
    tabs.forEach(function(b){ b.setAttribute("aria-selected",b.dataset.app===app); });

    Object.keys(frames).forEach(function(k){ frames[k].classList.toggle("active",k===app); });

    if(!frames[app]){            // load each app the first time its tab is opened
      var f=document.createElement("iframe");
      f.src="apps/"+app+".html";
      f.title=app;
      f.className="active";
      view.appendChild(f);
      frames[app]=f;
    }

    history.replaceState(null,"","#"+app);
  }

  tabs.forEach(function(b){ b.addEventListener("click",function(){ show(b.dataset.app); }); });

  // keep every iframe exactly as tall as its app
  window.addEventListener("message",function(e){
    if(!e.data||!e.data.appHeight) return;
    Object.keys(frames).forEach(function(k){
      if(frames[k].contentWindow===e.source) frames[k].style.height=e.data.appHeight+"px";
    });
  });

  var start=location.hash.slice(1);
  show(tabs.some(function(b){return b.dataset.app===start;})?start:tabs[0].dataset.app);
})();
</script>
</body>
</html>
