<button class="theme" id="theme">🌙 DARK MODE</button>

<h2>Unit Circle & Sinusoids</h2>

width="430" height="430"></canvas>

width="600" height="450"></canvas>

<script>
(function(){

const root=document.getElementById("app");

const circle=root.querySelector("#circle");
const waves=root.querySelector("#waves");

const c=circle.getContext("2d");
const w=waves.getContext("2d");

const freq=root.querySelector("#freq");
const win=root.querySelector("#window");
const stepInput=root.querySelector("#step");
const status=root.querySelector("#status");

let time=0;
let playing=false;
let lastTimestamp=null;
let animationID=null;

const cx=215;
const cy=215;
const R=155;

// ======================================
// THEMES (light / dark)
// ======================================

const themes={
    light:{text:"#1f2a44",axis:"#9aa6bf",circle:"#2b3a67",radius:"#e5484d",
           cosProj:"#2f6fed",sinProj:"#12a36a",center:"#1f2a44",
           cos:"#2f6fed",sin:"#12a36a",grid:"#e0e6f3",zero:"#9aa6bf",
           tick:"#44506e",axisLine:"#44506e",
           legendBg:"rgba(255,255,255,0.93)",legendBorder:"#c3cfe6",
           discInner:"rgba(47,111,237,0.02)",discOuter:"rgba(47,111,237,0.13)",
           wedge:"rgba(229,72,77,0.22)",
           areaCos:"rgba(47,111,237,0.10)",areaSin:"rgba(18,163,106,0.10)",
           plotBg:"rgba(47,111,237,0.035)",dotRing:"#ffffff",glow:5},
    dark:{text:"#e6edf7",axis:"#6e7b96",circle:"#9db4ff",radius:"#ff6b6b",
          cosProj:"#58a6ff",sinProj:"#3ddc97",center:"#ffffff",
          cos:"#58a6ff",sin:"#3ddc97",grid:"#27324a",zero:"#6e7b96",
          tick:"#b4c0d9",axisLine:"#b4c0d9",
          legendBg:"rgba(15,21,34,0.93)",legendBorder:"#3b4866",
          discInner:"rgba(88,166,255,0.03)",discOuter:"rgba(88,166,255,0.20)",
          wedge:"rgba(255,107,107,0.30)",
          areaCos:"rgba(88,166,255,0.15)",areaSin:"rgba(61,220,151,0.15)",
          plotBg:"rgba(255,255,255,0.025)",dotRing:"#111724",glow:16}
};

let darkMode=!!(window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches);
let T=themes.light;
const themeBtn=root.querySelector("#theme");

function applyTheme(){
    T=darkMode?themes.dark:themes.light;
    root.classList.toggle("dark",darkMode);
    document.body.style.background=darkMode?"#0d1117":"transparent";
    themeBtn.textContent=darkMode?"☀ LIGHT MODE":"🌙 DARK MODE";
}

themeBtn.addEventListener("click",function(){
    darkMode=!darkMode;
    applyTheme();
    render();
});

applyTheme();

// ======================================
// PARAMETERS
// ======================================

function getFrequency(){
    return Math.max(0.01,Number(freq.value)||1);
}

function getStep(){
    return Math.max(0.001,Number(stepInput.value)||0.02);
}

function getWindow(){
    return Math.max(0.1,Number(win.value)||2);
}

// ======================================
// UNIT CIRCLE
// ======================================

function drawCircle(){

    c.clearRect(0,0,430,430);

    const omega=2*Math.PI*getFrequency();
    const angle=omega*time;

    const x=Math.cos(angle);
    const y=Math.sin(angle);

    // Canvas Y-axis is inverted
    const px=cx+R*x;
    const py=cy-R*y;

    // Half-radius guide ring
    c.strokeStyle=T.grid;
    c.lineWidth=1;
    c.setLineDash([3,4]);

    c.beginPath();
    c.arc(cx,cy,R/2,0,2*Math.PI);
    c.stroke();

    c.setLineDash([]);

    // Coordinate axes
    c.strokeStyle=T.axis;
    c.lineWidth=1;

    c.beginPath();
    c.moveTo(25,cy);
    c.lineTo(405,cy);
    c.moveTo(cx,25);
    c.lineTo(cx,405);
    c.stroke();

    // Tick marks every 30 degrees
    for(let k=0;k<12;k++){

        const a=k*Math.PI/6;

        c.beginPath();
        c.moveTo(cx+(R-6)*Math.cos(a),cy-(R-6)*Math.sin(a));
        c.lineTo(cx+(R+6)*Math.cos(a),cy-(R+6)*Math.sin(a));
        c.stroke();
    }

    // Unit circle
    c.strokeStyle=T.circle;
    c.lineWidth=2.5;

    c.beginPath();
    c.arc(cx,cy,R,0,2*Math.PI);
    c.stroke();

    // Angle wedge
    const a=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);

    if(a>0.001){

        c.strokeStyle=T.radius;
        c.lineWidth=1.8;
        c.beginPath();
        c.arc(cx,cy,42,0,-a,true);
        c.stroke();

        if(a>0.4){
            c.fillStyle=T.radius;
            c.font="bold 15px Arial";
            c.fillText("θ",
                cx+60*Math.cos(a/2)-4,
                cy-60*Math.sin(a/2)+5);
        }
    }

    // Radius
    c.strokeStyle=T.radius;
    c.lineWidth=3.5;
    c.lineCap="round";

    c.beginPath();
    c.moveTo(cx,cy);
    c.lineTo(px,py);
    c.stroke();

    c.lineCap="butt";

    // Cosine projection
    c.strokeStyle=T.cosProj;
    c.lineWidth=2.5;
    c.setLineDash([6,5]);

    c.beginPath();
    c.moveTo(px,py);
    c.lineTo(px,cy);
    c.stroke();

    // Sine projection
    c.strokeStyle=T.sinProj;

    c.beginPath();
    c.moveTo(px,py);
    c.lineTo(cx,py);
    c.stroke();

    c.setLineDash([]);

    // Projection markers on the axes
    c.fillStyle=T.cosProj;
    c.beginPath();
    c.arc(px,cy,5,0,2*Math.PI);
    c.fill();

    c.fillStyle=T.sinProj;
    c.beginPath();
    c.arc(cx,py,5,0,2*Math.PI);
    c.fill();

    // Moving point (with glow)
    c.save();
    c.shadowColor=T.radius;
    c.shadowBlur=T.glow+6;

    c.fillStyle=T.radius;
    c.beginPath();
    c.arc(px,py,10,0,2*Math.PI);
    c.fill();

    c.restore();

    c.strokeStyle=T.dotRing;
    c.lineWidth=2.5;
    c.beginPath();
    c.arc(px,py,10,0,2*Math.PI);
    c.stroke();

    // Center
    c.fillStyle=T.center;
    c.beginPath();
    c.arc(cx,cy,4,0,2*Math.PI);
    c.fill();

    // Labels
    c.fillStyle=T.text;
    c.font="bold 15px Arial";

    c.fillText("UNIT CIRCLE",145,22);

    c.font="15px Arial";
    c.fillText("0°",cx+R+10,cy+5);
    c.fillText("90°",cx-20,cy-R-10);
    c.fillText("180°",cx-R-45,cy+5);
    c.fillText("270°",cx-25,cy+R+20);

    c.font="bold 15px Arial";

    c.fillStyle=T.radius;
    c.fillText("P",px+14,py-12);

    c.fillStyle=T.cos;
    c.fillText("cos(θ)",px+8,cy+20);

    c.fillStyle=T.sin;
    c.fillText("sin(θ)",cx-65,py-10);
}

// ======================================
// SINE AND COSINE GRAPH WITH GRID
// ======================================

function drawWaves(){

    const left=65;
    const right=580;
    const top=45;
    const bottom=365;

    const omega=2*Math.PI*getFrequency();
    const windowSize=getWindow();

    const start=Math.max(0,time-windowSize);
    const end=Math.max(windowSize,time);

    function X(t){
        return left+(t-start)/(end-start)*(right-left);
    }

    function Y(v){
        return 205-v*135;
    }

    function roundRect(ctx,x,y,wd,ht,r){
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.arcTo(x+wd,y,x+wd,y+ht,r);
        ctx.arcTo(x+wd,y+ht,x,y+ht,r);
        ctx.arcTo(x,y+ht,x,y,r);
        ctx.arcTo(x,y,x+wd,y,r);
        ctx.closePath();
    }

    w.clearRect(0,0,600,450);

    // Vertical time grid
    const rawInterval=(end-start)/8;

    const magnitude=Math.pow(
        10,Math.floor(Math.log10(rawInterval))
    );

    const normalized=rawInterval/magnitude;

    let interval;

    if(normalized<=1) interval=magnitude;
    else if(normalized<=2) interval=2*magnitude;
    else if(normalized<=5) interval=5*magnitude;
    else interval=10*magnitude;

    const firstTick=Math.ceil(start/interval)*interval;

    w.font="11px Arial";
    w.textAlign="center";

    for(let t=firstTick;t<=end+interval*0.001;t+=interval){

        const xx=X(t);

        w.strokeStyle=T.grid;
        w.lineWidth=1;

        w.beginPath();
        w.moveTo(xx,top);
        w.lineTo(xx,bottom);
        w.stroke();

        w.fillStyle=T.tick;
        w.fillText(t.toFixed(2),xx,bottom+18);
    }

    // Horizontal amplitude grid
    const amplitudes=[-1,-0.5,0,0.5,1];

    w.textAlign="right";

    amplitudes.forEach(v=>{

        const yy=Y(v);

        w.strokeStyle=(v===0)?T.zero:T.grid;
        w.lineWidth=(v===0)?1.5:1;

        w.beginPath();
        w.moveTo(left,yy);
        w.lineTo(right,yy);
        w.stroke();

        w.fillStyle=T.tick;
        w.fillText(v.toFixed(1),left-10,yy+4);
    });

    // Axes
    w.strokeStyle=T.axisLine;
    w.lineWidth=1.5;

    w.beginPath();
    w.moveTo(left,top);
    w.lineTo(left,bottom);
    w.lineTo(right,bottom);
    w.stroke();

    w.fillStyle=T.text;
    w.textAlign="center";
    w.font="bold 14px Arial";

    w.fillText("SINUSOIDAL SIGNALS",300,23);

    w.font="14px Arial";
    w.fillText("Time (seconds)",320,420);

    w.save();
    w.translate(15,205);
    w.rotate(-Math.PI/2);
    w.fillText("Amplitude",0,0);
    w.restore();

    // Draw waveforms (glowing line)
    function trace(fn){

        for(let i=0;i<=800;i++){

            const t=start+(end-start)*i/800;

            const xx=X(t);
            const yy=Y(fn(omega*t));

            if(i===0) w.moveTo(xx,yy);
            else w.lineTo(xx,yy);
        }
    }

    function plot(color,fillColor,fn){

        // Wave line with glow
        w.save();
        w.shadowColor=color;
        w.shadowBlur=T.glow;

        w.beginPath();
        w.strokeStyle=color;
        w.lineWidth=2.8;
        w.lineJoin="round";
        trace(fn);
        w.stroke();

        w.restore();
    }

    plot(T.sin,T.areaSin,Math.sin);
    plot(T.cos,T.areaCos,Math.cos);

    // Moving cursor
    const px=X(time);

    w.strokeStyle=T.radius;
    w.lineWidth=1.8;
    w.setLineDash([5,5]);

    w.beginPath();
    w.moveTo(px,top);
    w.lineTo(px,bottom);
    w.stroke();

    w.setLineDash([]);

    // Moving signal points
    const angle=omega*time;

    function dot(color,value){

        w.save();
        w.shadowColor=color;
        w.shadowBlur=T.glow+4;

        w.fillStyle=color;
        w.beginPath();
        w.arc(px,Y(value),7.5,0,2*Math.PI);
        w.fill();

        w.restore();

        w.strokeStyle=T.dotRing;
        w.lineWidth=2;
        w.beginPath();
        w.arc(px,Y(value),7.5,0,2*Math.PI);
        w.stroke();
    }

    dot(T.sin,Math.sin(angle));
    dot(T.cos,Math.cos(angle));

    // Legend (rounded box with solid background)
    roundRect(w,455,47,115,52,8);
    w.fillStyle=T.legendBg;
    w.fill();

    w.textAlign="left";
    w.font="bold 13px Arial";

    w.fillStyle=T.sin;
    w.fillText("● Sine",467,68);

    w.fillStyle=T.cos;
    w.fillText("● Cosine",467,88);
}

// ======================================
// UPDATE DISPLAY
// ======================================

function render(){

    drawCircle();
    drawWaves();

    const f=getFrequency();
    const omega=2*Math.PI*f;

    const angle=(omega*time*180/Math.PI)%360;

    status.textContent=
        "Time: "+time.toFixed(3)+" s | "+
        "Angle: "+angle.toFixed(1)+"° | "+
        "Frequency: "+f.toFixed(2)+" Hz | "+
        "ω: "+omega.toFixed(2)+" rad/s";
}

// ======================================
// ANIMATION
// ======================================

function animate(timestamp){

    if(!playing) return;

    if(lastTimestamp!==null){

        const elapsed=Math.min(
            (timestamp-lastTimestamp)/1000,
            0.05
        );

        time+=elapsed;
    }

    lastTimestamp=timestamp;

    render();

    animationID=requestAnimationFrame(animate);
}

// ======================================
// PAUSE
// ======================================

function pause(){

    playing=false;

    if(animationID!==null){
        cancelAnimationFrame(animationID);
    }

    animationID=null;
    lastTimestamp=null;
}

// ======================================
// PLAY
// ======================================

root.querySelector("#play").addEventListener("click",function(){

    if(playing) return;

    playing=true;
    lastTimestamp=null;

    animationID=requestAnimationFrame(animate);
});

// ======================================
// PAUSE BUTTON
// ======================================

root.querySelector("#pause").addEventListener("click",pause);

// ======================================
// RESET
// ======================================

root.querySelector("#reset").addEventListener("click",function(){

    pause();
    time=0;
    render();
});

// ======================================
// STEP FORWARD
// ======================================

root.querySelector("#forward").addEventListener("click",function(){

    pause();
    time+=getStep();
    render();
});

// ======================================
// STEP BACK
// ======================================

root.querySelector("#back").addEventListener("click",function(){

    pause();
    time=Math.max(0,time-getStep());
    render();
});

// ======================================
// FREQUENCY INPUT
// ======================================

freq.addEventListener("change",function(){

    if(!Number.isFinite(Number(freq.value)) ||
       Number(freq.value)<=0){

        freq.value=1;
    }

    render();
});

// ======================================
// TIME WINDOW INPUT
// ======================================

win.addEventListener("change",function(){

    if(!Number.isFinite(Number(win.value)) ||
       Number(win.value)<=0){

        win.value=2;
    }

    render();
});

// ======================================
// STEP SIZE INPUT
// ======================================

stepInput.addEventListener("change",function(){

    if(!Number.isFinite(Number(stepInput.value)) ||
       Number(stepInput.value)<=0){

        stepInput.value=0.02;
    }
});

// ======================================
// RESPONSIVE RESIZING
// ======================================

<script>
// tell the parent page how tall this app is, so the iframe fits it exactly
(function(){
  var el=document.getElementById("app");
  function send(){
    var h=Math.ceil(el.getBoundingClientRect().height)+16;
    if(window.parent!==window) window.parent.postMessage({appHeight:h,app:location.pathname},"*");
  }
  if(typeof ResizeObserver!=="undefined") new ResizeObserver(send).observe(el);
  window.addEventListener("load",send);
  window.addEventListener("resize",send);
  send();
})();
</script>
